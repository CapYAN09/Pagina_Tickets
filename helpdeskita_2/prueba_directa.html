<!DOCTYPE html>
<html>
<head>
    <title>Prueba Directa Login</title>
    <script src="/helpdeskita_2/public/jquery/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Prueba Directa de Login</h1>
    
    <form id="testForm">
        <input type="text" name="login" value="admin" placeholder="Usuario">
        <input type="password" name="password" value="password" placeholder="Contraseña">
        <button type="button" onclick="probarLogin()">Probar Login</button>
    </form>
    
    <div id="resultado"></div>
    
    <script>
    function probarLogin() {
        var formData = $('#testForm').serialize();
        
        console.log("🔍 Probando login con datos:", formData);
        
        $.ajax({
            type: "POST",
            url: "/helpdeskita_2/procesos/usuarios/login/loginUsuarios.php",
            data: formData,
            success: function(respuesta) {
                console.log("✅ Éxito - Respuesta:", respuesta);
                $('#resultado').html('<p style="color: green">Respuesta: ' + respuesta + '</p>');
            },
            error: function(xhr, status, error) {
                console.error("💥 Error:", error);
                $('#resultado').html('<p style="color: red">Error: ' + error + '</p>');
            }
        });
    }
    </script>
</body>
</html>
