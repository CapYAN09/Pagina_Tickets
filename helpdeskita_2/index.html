      <script>
// Debug de carga de scripts
console.log("=== DEBUG CARGA DE SCRIPTS ===");
console.log("jQuery cargado:", typeof jQuery !== 'undefined' ? "✅ SÍ" : "❌ NO");
console.log("SweetAlert cargado:", typeof Swal !== 'undefined' ? "✅ SÍ" : "❌ NO");
console.log("Función loginusuario:", typeof loginusuario !== 'undefined' ? "✅ SÍ" : "❌ NO");

// Verificar que el formulario existe y tiene el evento
document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('frmlogin');
    console.log("Formulario encontrado:", form ? "✅ SÍ" : "❌ NO");
    if(form) {
        console.log("Evento onsubmit del formulario:", form.onsubmit);
    }
});

// Función de prueba simple
function pruebaLoginSimple() {
    console.log("🎯 pruebaLoginSimple ejecutada");
    event.preventDefault();
    
    var usuario = document.getElementById('login').value;
    var password = document.getElementById('password').value;
    
    console.log("Datos:", {usuario: usuario, password: password});
    
    // Prueba directa con fetch
    fetch('/helpdeskita_2/procesos/usuarios/login/loginUsuarios.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'login=' + encodeURIComponent(usuario) + '&password=' + encodeURIComponent(password)
    })
    .then(response => response.text())
    .then(data => {
        console.log("Respuesta:", data);
        if(data.trim() === "1") {
            console.log("✅ Éxito - Redirigiendo...");
            window.location.href = "/helpdeskita_2/vistas/inicio.php";
        } else {
            console.log("❌ Fallo - Mostrando alerta");
            alert("Error: " + data);
        }
    })
    .catch(error => {
        console.error("Error:", error);
    });
    
    return false;
}
</script>
